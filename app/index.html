<!-- Vercel Web Analytics (Will, Oct 30): only on the live site, never in previews or tests. Cookieless. -->
<script>if ('%MODE%' !== 'demo' && location.hostname === 'hickeytournament.vercel.app') { window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  var va = document.createElement('script'); va.defer = true; va.src = '/_vercel/insights/script.js'; document.head.appendChild(va); }</script>
<!-- Save this page on the phone so it opens with no signal (/sw.js). Plain script so it runs even if Firebase can't load. Not in the preview build. -->
<script>if ('%MODE%' !== 'demo' && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) addEventListener('load', function () { try {
  navigator.serviceWorker.register('/sw.js').catch(function () {});
  navigator.serviceWorker.ready.then(function (r) { setTimeout(function () {
    var keep = [location.pathname];
    performance.getEntriesByType('resource').forEach(function (x) { if (/gstatic\.com\/firebasejs\/|fonts\.(googleapis|gstatic)\.com/.test(x.name)) keep.push(x.name); });
    r.active && r.active.postMessage({ keep: keep });
  }, 3000); });
} catch (e) {} });</script>
